<div class="home-container">
  <div class="button-container">
    <button class="new-game-button" mat-raised-button (click)="openDialog()">
      New List
    </button>
  </div>

  <div class="top-games-container">
    <div class="top-games">
      <h2>All Time Most Chosen Games</h2>
      @for (list of lists; track list.id) {
        <h3>{{ list.title }}</h3>
      }
    </div>
  </div>
</div>
